[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "serverless-multilingual-rag"
version = "3.2.0"
description = "Multilingual RAG API on Azure Container Apps and Azure AI Search"
readme = "README.md"
requires-python = ">=3.14,<3.15"
# The serving image only needs ONNX Runtime for embeddings. PyTorch and
# sentence-transformers are development-only (baseline model comparisons).
dependencies = [
  "azure-core==1.41.0",
  "azure-search-documents==12.0.0",
  "ddtrace==4.16.1",
  "fastapi==0.162.0",
  "numpy==2.5.4",
  "onnxruntime==1.31.1",
  "openai==3.41.0",
  "pydantic-settings==2.16.2",
  "python-dotenv==1.2.4",
  "python-json-logger==4.2.0",
  "tokenizers==0.23.3",
  "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "mypy==2.4.1",
  "pip-audit==2.10.1",
  "pypdf==6.21.4",
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1",
  "pytest-cov==7.1.0",
  "requests==2.34.2",
  "ruff==0.17.3",
  "sentence-transformers==6.2.0",
  "torch==2.15.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py314"
line-length = 110
extend-exclude = ["rebuild.sh"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# CJK outline and sentence punctuation is matched deliberately.
"app/chunking.py" = ["RUF001"]
"tests/test_chunking.py" = ["RUF001"]
"scripts/*.py" = ["E402", "S603"]
"tests/*.py" = ["S105", "S106"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["scripts"]

[[tool.mypy.overrides]]
module = [
  "azure.*",
  "ddtrace.*",
  "onnxruntime.*",
  "pythonjsonlogger.*",
  "tokenizers.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
