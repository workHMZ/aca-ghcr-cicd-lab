name: CI - Build Scan SBOM Sign Push to GHCR

on:
  push:
    branches: [main]
    paths:
      - '.github/**'
      - 'app/**'
      - 'scripts/**'
      - 'tests/**'
      - 'eval/**'
      - 'terraform/**'
      - '.python-version'
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'requirements*.txt'
      - '.env.example'
      - 'service.datadog.yaml'
  pull_request:
    branches: [main]
    paths:
      - '.github/**'
      - 'app/**'
      - 'scripts/**'
      - 'tests/**'
      - 'eval/**'
      - 'terraform/**'
      - '.python-version'
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'requirements*.txt'
      - '.env.example'
      - 'service.datadog.yaml'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  UV_VERSION: 0.12.18
  PYTHON_VERSION: 3.12.14
  TERRAFORM_VERSION: 1.16.4
  ACTIONLINT_VERSION: 1.7.12

jobs:
  quality:
    name: Quality, tests, and Terraform validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install locked Python environment
        run: |
          uv python install "${PYTHON_VERSION}"
          uv sync --frozen --dev --python "${PYTHON_VERSION}"

      - name: Run repository verification
        run: PATH="$PWD/.venv/bin:$PATH" bash scripts/verify.sh

      - name: Cache pinned embedding models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/serverless-rag
            ~/.cache/huggingface
          key: embedding-models-${{ hashFiles('app/model_manifest.py') }}-minilm-1110a243

      # The candidate runs through the production ONNX int8 encoder (app.embed);
      # the English-only baseline runs through sentence-transformers.
      - name: Run pinned multilingual retrieval regression
        run: |
          uv run python scripts/evaluate_retrieval.py \
            --backend local \
            --model sentence-transformers/all-MiniLM-L6-v2 \
            --revision 1110a243fdf4706b3f48f1d95db1a4f5529b4d41 \
            --model intfloat/multilingual-e5-small \
            --revision 614241f622f53c4eeff9890bdc4f31cfecc418b3 \
            | tee retrieval-eval.json
          # Gate on top-3 recall rather than exact top-1: fixture query ja-gc is
          # a near tie (0.798 vs 0.794 cosine even in fp32) that int8 kernels
          # rank differently on x86 and ARM. Broken prefixes, pooling, or model
          # loading still drop expected passages out of the top 3 and fail here.
          python - <<'PY'
          import json

          report = json.load(open("retrieval-eval.json", encoding="utf-8"))
          candidate = report["models"][1]["metrics"]
          assert candidate["overall"]["recall@3"] >= 1.0, candidate["overall"]
          for language, metrics in candidate["by_language"].items():
              assert metrics["recall@3"] >= 1.0, (language, metrics)
          assert candidate["overall"]["mrr"] >= 0.9, candidate["overall"]
          print("Retrieval regression gate passed:", candidate["overall"])
          PY

      - name: Validate GitHub Actions workflows
        shell: bash
        run: |
          set -euo pipefail
          actionlint_dir="${RUNNER_TEMP}/actionlint-${ACTIONLINT_VERSION}"
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          mkdir -p "$actionlint_dir"
          curl --fail --location --silent --show-error \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' \
            '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' \
            "$archive" \
            | sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$actionlint_dir"
          "$actionlint_dir/actionlint" -color

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.0
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Validate Terraform
        run: |
          terraform fmt -check -recursive terraform
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate

  container-smoke:
    name: Container smoke test (0.5 vCPU / 1 GiB, no network)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: smoke:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot offline under replica limits and probe
        run: bash scripts/smoke_container.sh "smoke:${GITHUB_SHA}"

      # The live app keeps the Datadog Agent sidecar (experimental), so CD
      # starts it under ddtrace-run; prove that path boots in the same budget.
      - name: Boot with Datadog tracing enabled (no Agent reachable)
        env:
          SMOKE_ENV: DD_TRACE_ENABLED=true DD_SERVICE=serverless-rag-api DD_ENV=ci
        run: bash scripts/smoke_container.sh "smoke:${GITHUB_SHA}"

      - name: Report image size
        run: |
          size=$(docker image inspect "smoke:${GITHUB_SHA}" --format '{{.Size}}')
          {
            echo '### Container smoke test'
            echo "- Uncompressed image size: $((size / 1024 / 1024)) MiB"
          } >> "$GITHUB_STEP_SUMMARY"

  build-scan-sign-push:
    name: Build once, verify, sign, and publish
    # CD verifies a push-triggered ci.yml certificate. Manual dispatch remains
    # useful for quality checks but deliberately cannot publish a deployable image.
    if: github.event_name == 'push'
    needs: [quality, container-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image_repo: ${{ steps.image.outputs.image_repo }}
      image_tag: ${{ steps.image.outputs.image_tag }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2

      - name: Prepare immutable image reference
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image_repo="${REGISTRY}/${GITHUB_REPOSITORY}"
          image_repo="${image_repo,,}"
          image_tag="sha-${GITHUB_SHA}"
          app_version=$(sed -n 's/^__version__ *= *"\([^"]*\)"/\1/p' app/__init__.py)
          test -n "$app_version"
          {
            echo "image_repo=$image_repo"
            echo "image_tag=$image_tag"
            echo "app_version=$app_version"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable candidate
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.image_repo }}:${{ steps.image.outputs.image_tag }}
          build-args: |
            APP_VERSION=${{ steps.image.outputs.app_version }}
            BUILD_SHA=${{ github.sha }}
            IMAGE_TAG=${{ steps.image.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan the exact candidate digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.image_repo }}@${{ steps.build.outputs.digest }}
          scanners: vuln
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: Generate SBOM from the exact candidate digest
        run: |
          syft "${{ steps.image.outputs.image_repo }}@${{ steps.build.outputs.digest }}" \
            --output cyclonedx-json=sbom.cdx.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Attest the exact candidate digest with its SBOM
        run: |
          cosign attest --yes \
            --predicate sbom.cdx.json \
            --type cyclonedx \
            "${{ steps.image.outputs.image_repo }}@${{ steps.build.outputs.digest }}"

      - name: Export verified image digest
        run: printf '%s\n' '${{ steps.build.outputs.digest }}' > digest.txt

      - name: Upload digest artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digest
          path: digest.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ steps.image.outputs.image_tag }}
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

      - name: Promote verified digest to latest
        run: |
          docker buildx imagetools create \
            --tag "${{ steps.image.outputs.image_repo }}:latest" \
            "${{ steps.image.outputs.image_repo }}@${{ steps.build.outputs.digest }}"

      - name: Sync Service Catalog metadata to Datadog
        continue-on-error: true
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
          DD_SITE: us5.datadoghq.com
        run: |
          if [ -z "${DD_API_KEY:-}" ] || [ -z "${DD_APP_KEY:-}" ]; then
            echo "Skipping Datadog Service Catalog sync: credentials are not configured."
            exit 0
          fi
          bash scripts/sync_datadog_catalog.sh service.datadog.yaml

      - name: Summary
        run: |
          {
            echo '### CI complete'
            echo '- Quality: ruff, mypy, pytest, pip-audit, retrieval regression, Terraform validation'
            echo '- Container: offline boot under 0.5 vCPU / 1 GiB with memory budget'
            echo "- Image: \`${{ steps.image.outputs.image_repo }}:${{ steps.image.outputs.image_tag }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo '- Supply chain: exact-digest Trivy scan, SBOM, signature, and attestation'
            echo "- Promotion: \`latest\` now points to the verified digest"
          } >> "$GITHUB_STEP_SUMMARY"

      # This is the deployment-authorization signature. Keep it after every
      # mandatory scan, attestation, artifact, promotion, and summary step so a
      # partially completed CI run cannot leave a CD-acceptable candidate.
      - name: Authorize the exact candidate digest for deployment
        run: cosign sign --yes "${{ steps.image.outputs.image_repo }}@${{ steps.build.outputs.digest }}"

  deploy:
    name: Auto Canary Deploy to Azure
    needs: [quality, container-smoke, build-scan-sign-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/cd.yml
    with:
      commit_sha: ${{ github.sha }}
      image_digest: ${{ needs.build-scan-sign-push.outputs.image_digest }}
    secrets: inherit
