name: CI - Build Scan SBOM Sign Push to GHCR

on:
  push:
    branches: [main]
    paths:
      - '.github/**'
      - 'app/**'
      - 'scripts/**'
      - 'tests/**'
      - 'eval/**'
      - 'terraform/**'
      - '.python-version'
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'requirements*.txt'
      - '.env.example'
      - 'service.datadog.yaml'
  pull_request:
    branches: [main]
    paths:
      - '.github/**'
      - 'app/**'
      - 'scripts/**'
      - 'tests/**'
      - 'eval/**'
      - 'terraform/**'
      - '.python-version'
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'requirements*.txt'
      - '.env.example'
      - 'service.datadog.yaml'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  UV_VERSION: 0.11.16
  PYTHON_VERSION: 3.12.13
  TERRAFORM_VERSION: 1.15.8
  ACTIONLINT_VERSION: 1.7.12

jobs:
  quality:
    name: Quality, tests, and Terraform validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.1.6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install locked Python environment
        run: |
          uv python install "${PYTHON_VERSION}"
          uv sync --frozen --dev --python "${PYTHON_VERSION}"

      - name: Run repository verification
        run: PATH="$PWD/.venv/bin:$PATH" bash scripts/verify.sh

      - name: Run pinned multilingual retrieval regression
        run: |
          uv run python scripts/evaluate_retrieval.py \
            --backend local \
            --model sentence-transformers/all-MiniLM-L6-v2 \
            --revision 1110a243fdf4706b3f48f1d95db1a4f5529b4d41 \
            --model intfloat/multilingual-e5-small \
            --revision 614241f622f53c4eeff9890bdc4f31cfecc418b3 \
            | tee retrieval-eval.json
          python -c 'import json; report=json.load(open("retrieval-eval.json", encoding="utf-8")); candidate=report["models"][1]["metrics"]; assert candidate["overall"]["recall@1"] >= 1.0; assert candidate["overall"]["recall@3"] >= 1.0; assert candidate["overall"]["mrr"] >= 1.0; assert candidate["by_language"]["ja"]["recall@1"] >= 1.0'

      - name: Validate GitHub Actions workflows
        shell: bash
        run: |
          set -euo pipefail
          actionlint_dir="${RUNNER_TEMP}/actionlint-${ACTIONLINT_VERSION}"
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          mkdir -p "$actionlint_dir"
          curl --fail --location --silent --show-error \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' \
            '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' \
            "$archive" \
            | sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$actionlint_dir"
          "$actionlint_dir/actionlint" -color

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.0
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Validate Terraform
        run: |
          terraform fmt -check -recursive terraform
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate

  build-scan-sign-push:
    name: Build once, verify, sign, and publish
    # CD verifies a push-triggered ci.yml certificate. Manual dispatch remains
    # useful for quality checks but deliberately cannot publish a deployable image.
    if: github.event_name == 'push'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image_repo: ${{ steps.image.outputs.image_repo }}
      image_tag: ${{ steps.image.outputs.image_tag }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2

      - name: Prepare immutable image reference
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image_repo="${REGISTRY}/${GITHUB_REPOSITORY}"
          image_repo="${image_repo,,}"
          image_tag="sha-${GITHUB_SHA}"
          app_version=$(sed -n 's/^__version__ *= *"\([^"]*\)"/\1/p' app/__init__.py)
          test -n "$app_version"
          {
            echo "image_repo=$image_repo"
            echo "image_tag=$image_tag"
            echo "app_version=$app_version"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable candidate
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.image_repo }}:${{ steps.image.outputs.image_tag }}
          build-args: |
            APP_VERSION=${{ steps.image.outputs.app_version }}
            BUILD_SHA=${{ github.sha }}
            IMAGE_TAG=${{ steps.image.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan the exact candidate digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.image_repo }}@${{ steps.build.outputs.digest }}
          scanners: vuln
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@28d71544de8eaf1b958d335707167c5f783590ad # v0.22.2

      - name: Generate SBOM from the exact candidate digest
        run: |
          syft "${{ steps.image.outputs.image_repo }}@${{ steps.build.outputs.digest }}" \
            --output cyclonedx-json=sbom.cdx.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0
        with:
          cosign-release: v3.0.5

      - name: Attest the exact candidate digest with its SBOM
        run: |
          cosign attest --yes \
            --predicate sbom.cdx.json \
            --type cyclonedx \
            "${{ steps.image.outputs.image_repo }}@${{ steps.build.outputs.digest }}"

      - name: Export verified image digest
        run: printf '%s\n' '${{ steps.build.outputs.digest }}' > digest.txt

      - name: Upload digest artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: image-digest
          path: digest.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: sbom-${{ steps.image.outputs.image_tag }}
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

      - name: Promote verified digest to latest
        run: |
          docker buildx imagetools create \
            --tag "${{ steps.image.outputs.image_repo }}:latest" \
            "${{ steps.image.outputs.image_repo }}@${{ steps.build.outputs.digest }}"

      - name: Sync Service Catalog metadata to Datadog
        continue-on-error: true
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
          DD_SITE: us5.datadoghq.com
        run: |
          if [ -z "${DD_API_KEY:-}" ] || [ -z "${DD_APP_KEY:-}" ]; then
            echo "Skipping Datadog Service Catalog sync: credentials are not configured."
            exit 0
          fi
          bash scripts/sync_datadog_catalog.sh service.datadog.yaml

      - name: Summary
        run: |
          {
            echo '### CI complete'
            echo '- Quality: ruff, mypy, pytest, pip-audit, Terraform validation'
            echo "- Image: \`${{ steps.image.outputs.image_repo }}:${{ steps.image.outputs.image_tag }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo '- Supply chain: exact-digest Trivy scan, SBOM, signature, and attestation'
            echo '- Promotion: `latest` now points to the verified digest'
          } >> "$GITHUB_STEP_SUMMARY"

      # This is the deployment-authorization signature. Keep it after every
      # mandatory scan, attestation, artifact, promotion, and summary step so a
      # partially completed CI run cannot leave a CD-acceptable candidate.
      - name: Authorize the exact candidate digest for deployment
        run: cosign sign --yes "${{ steps.image.outputs.image_repo }}@${{ steps.build.outputs.digest }}"

  deploy:
    name: Auto Canary Deploy to Azure
    needs: [quality, build-scan-sign-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/cd.yml
    with:
      commit_sha: ${{ github.sha }}
      image_digest: ${{ needs.build-scan-sign-push.outputs.image_digest }}
    secrets: inherit
