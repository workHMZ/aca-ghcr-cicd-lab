name: Security - Trivy Scan

on:
  push:
    branches: [main]
    paths:
      - '.github/**'
      - 'app/**'
      - 'scripts/**'
      - 'tests/**'
      - 'eval/**'
      - 'terraform/**'
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'requirements*.txt'
      - '.env.example'
  pull_request:
    branches: [main]
    paths:
      - '.github/**'
      - 'app/**'
      - 'scripts/**'
      - 'tests/**'
      - 'eval/**'
      - 'terraform/**'
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'requirements*.txt'
      - '.env.example'
  schedule:
    - cron: '23 20 * * 1'
      timezone: 'Asia/Tokyo'
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: actions
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.35.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Analyze
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.35.0
        with:
          category: /language:${{ matrix.language }}

  trivy-scan:
    name: Filesystem, IaC, secret, and image scan
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      security-events: write
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2

      - name: Scan repository and Terraform configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          format: sarif
          output: trivy-fs-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Upload repository scan results
        if: >-
          always() &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.35.0
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-filesystem-iac-secrets

      - name: Gate repository findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build deployable image once for scanning
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          load: true
          tags: security-scan:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan deployable image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: security-scan:${{ github.sha }}
          scanners: vuln
          format: sarif
          output: trivy-image-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Upload image scan results
        if: >-
          always() &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.35.0
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-container

      - name: Gate deployable image findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: security-scan:${{ github.sha }}
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Security summary
        if: success()
        run: |
          echo '### Security scan passed' >> "$GITHUB_STEP_SUMMARY"
          echo 'Repository, Terraform, secrets, dependencies, and the deployable image passed the HIGH/CRITICAL gate.' >> "$GITHUB_STEP_SUMMARY"
